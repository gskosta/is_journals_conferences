<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Information Systems Research Venue Portal</title>
<style>
:root {
  --bg:#f6f8f6;
  --panel:#ffffff;
  --ink:#23332e;
  --muted:#6b7b75;
  --line:#dfe8e2;
  --green:#4c7c6a;
  --green-soft:#e8f2ed;
  --blue:#5e7894;
  --blue-soft:#eaf0f6;
  --shadow:0 18px 50px rgba(52,78,67,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:
radial-gradient(circle at 10% 0%,rgba(202,225,214,.42),transparent 30rem),
radial-gradient(circle at 95% 10%,rgba(205,219,232,.38),transparent 28rem),
var(--bg);}
button{font:inherit}
#chooser{
  min-height:100vh;display:grid;place-items:center;padding:28px;
}
.hero{width:min(1050px,100%);}
.brand{
  display:inline-flex;align-items:center;gap:9px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.75);
  color:var(--green);font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
}
h1{font-size:clamp(34px,5vw,60px);line-height:1.02;letter-spacing:-.045em;margin:18px 0 10px;max-width:850px}
.lead{max-width:810px;color:var(--muted);font-size:17px;line-height:1.7;margin:0}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.choice{
  text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:24px;
  padding:26px;cursor:pointer;box-shadow:var(--shadow);transition:.18s ease;min-height:225px;
}
.choice:hover{transform:translateY(-4px);border-color:#bed2c8}
.choice .icon{font-size:34px;display:block;margin-bottom:18px}
.choice h2{margin:0 0 8px;font-size:26px;letter-spacing:-.025em}
.choice p{margin:0;color:var(--muted);line-height:1.55}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.tag{font-size:11px;font-weight:750;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:#f8faf8}
.choice.journals .tag{background:var(--green-soft)}
.choice.conferences .tag{background:var(--blue-soft)}
.note{margin-top:18px;color:#82908b;font-size:13px}

#workspace{display:none;min-height:100vh;background:#fff}
.topbar{
  height:62px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:#f7f9f7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
}
.home-btn,.tab-btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;
  padding:9px 13px;cursor:pointer;font-weight:700;
}
.home-btn:hover,.tab-btn:hover{background:#f0f5f2}
.tab-btn.active{background:var(--green);border-color:var(--green);color:white}
.spacer{flex:1}
.caption{font-size:13px;color:var(--muted);white-space:nowrap}
iframe{display:none;width:100%;height:calc(100vh - 62px);border:0;background:white}
iframe.active{display:block}
@media(max-width:760px){
  #chooser{padding:18px}
  .choice-grid{grid-template-columns:1fr}
  .choice{min-height:auto}
  .caption{display:none}
  .topbar{overflow-x:auto}
}

html[data-theme="dark"] {
  --bg:#0f1420;
  --panel:#171d29;
  --ink:#edf3f0;
  --muted:#a8b6b0;
  --line:#2a3640;
  --green:#70b493;
  --green-soft:#20362d;
  --blue:#86a7c3;
  --blue-soft:#223243;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}
html[data-theme="dark"] body{
  background:
    radial-gradient(circle at 10% 0%,rgba(57,92,76,.42),transparent 30rem),
    radial-gradient(circle at 95% 10%,rgba(53,73,95,.38),transparent 28rem),
    var(--bg);
}
html[data-theme="dark"] .brand,
html[data-theme="dark"] .choice,
html[data-theme="dark"] .home-btn,
html[data-theme="dark"] .tab-btn{
  background:var(--panel);
  color:var(--ink);
}
html[data-theme="dark"] .topbar{
  background:#121823;
}
html[data-theme="dark"] .choice:hover,
html[data-theme="dark"] .home-btn:hover,
html[data-theme="dark"] .tab-btn:hover{
  background:#1d2631;
}
html[data-theme="dark"] .tab-btn.active{
  background:var(--green);
  color:#0f1713;
}
.theme-toggle{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  border-radius:11px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:700;
  white-space:nowrap;
}
.theme-toggle:hover{background:var(--green-soft)}


/* Full-dark portal override */
html, body {
  background:#0b0f14 !important;
  color:#eef3f1 !important;
  color-scheme:dark;
}
#chooser, #workspace {
  background:
    radial-gradient(circle at 15% 0%, rgba(31,74,57,.28), transparent 34rem),
    radial-gradient(circle at 92% 6%, rgba(31,54,78,.30), transparent 32rem),
    #0b0f14 !important;
}
.hero, .choice, .topbar, .home-btn, .tab-btn, .brand {
  background:#121820 !important;
  color:#eef3f1 !important;
  border-color:#27323a !important;
}
.choice {
  box-shadow:0 18px 50px rgba(0,0,0,.34) !important;
}
.choice:hover, .home-btn:hover, .tab-btn:hover {
  background:#18212b !important;
  border-color:#3b6654 !important;
}
.lead, .choice p, .note, .caption {
  color:#a9b7b1 !important;
}
.tag {
  background:#1a2521 !important;
  color:#cfe2d8 !important;
  border-color:#2d4238 !important;
}
.choice.conferences .tag {
  background:#182431 !important;
  color:#c9d9e7 !important;
  border-color:#2c4052 !important;
}
.tab-btn.active {
  background:#4d8d70 !important;
  color:#08100c !important;
  border-color:#4d8d70 !important;
}
iframe {
  background:#0b0f14 !important;
}


/* Responsive navigation */
.nav-brand-row{
  display:flex;
  align-items:center;
  gap:10px;
}
.nav-links{
  display:flex;
  align-items:center;
  gap:10px;
}
.mobile-title{
  display:none;
  font-weight:800;
  color:#eef3f1;
  white-space:nowrap;
}
.menu-btn{
  display:none;
  width:42px;
  height:40px;
  border:1px solid #27323a;
  background:#121820;
  border-radius:10px;
  padding:9px;
  cursor:pointer;
  flex-direction:column;
  justify-content:center;
  gap:4px;
}
.menu-btn span{
  display:block;
  width:100%;
  height:2px;
  border-radius:99px;
  background:#eef3f1;
  transition:.18s ease;
}
.menu-btn.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.menu-btn.open span:nth-child(2){opacity:0}
.menu-btn.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

@media (max-width: 900px){
  .topbar{
    height:auto !important;
    min-height:60px;
    padding:10px 12px !important;
    display:grid !important;
    grid-template-columns:1fr auto;
    gap:8px 12px;
    overflow:visible !important;
  }
  .nav-brand-row{
    grid-column:1 / -1;
    width:100%;
    justify-content:space-between;
  }
  .mobile-title{display:inline}
  .menu-btn{display:flex}
  .nav-links{
    display:none;
    grid-column:1 / -1;
    width:100%;
    flex-direction:column;
    align-items:stretch;
    padding-top:6px;
  }
  .nav-links.open{display:flex}
  .nav-links .tab-btn{
    width:100%;
    text-align:left;
    padding:12px 14px !important;
  }
  .spacer,.caption{display:none !important}
  iframe{
    height:calc(100vh - 60px) !important;
  }
}

@media (max-width: 640px){
  #chooser{
    padding:14px !important;
    align-items:start !important;
  }
  .hero{
    width:100% !important;
    padding-top:18px;
  }
  .choice-grid{
    grid-template-columns:1fr !important;
    gap:12px !important;
    margin-top:22px !important;
  }
  .choice{
    padding:20px !important;
    min-height:auto !important;
    border-radius:18px !important;
  }
  .choice .icon{font-size:28px !important;margin-bottom:12px !important}
  .choice h2{font-size:22px !important}
  .tags{gap:5px !important}
  .tag{font-size:10px !important}
  .brand{font-size:10px !important}
  .home-btn{
    padding:8px 10px !important;
    font-size:13px !important;
  }
}

@media (max-width: 420px){
  .mobile-title{font-size:13px}
  .menu-btn{width:38px;height:38px}
  .choice{padding:17px !important}
}

</style>
</head>
<body>

<section id="chooser">
  <div class="hero">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><span class="brand">Information Systems Research Venues</span></div>
    <h3>Choose your publication venue</h3>
    <div class="choice-grid">
      <button class="choice conferences" data-open="conferences" aria-label="Open IS conferences">
        <span class="icon">🗓️</span>
        <h2>IS Conferences</h2>
          <div class="tags">
          <span class="tag">144 venues</span>
          <span class="tag">Submission months</span>
          <span class="tag">JUFO</span>
          <span class="tag">CORE / ERA / Qualis</span>
        </div>
      </button>

      <button class="choice journals" data-open="journals" aria-label="Open IS journals">
        <span class="icon">📚</span>
        <h2>IS Journals</h2>

        <div class="tags">
          <span class="tag">45 journals</span>
          <span class="tag">AIS Premier 11</span>
          <span class="tag">FT50</span>
          <span class="tag">JUFO 1–3</span>
        </div>
      </button>
    </div>
  </div>
</section>

<section id="workspace">
  <nav class="topbar">
    <div class="nav-brand-row">
      <button class="home-btn" id="homeBtn">← Home</button>
      <span class="mobile-title">IS Research Portal</span>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="nav-links" id="navLinks">
      <button class="tab-btn" id="confTab">IS Conferences</button>
      <button class="tab-btn" id="jourTab">IS Journals</button>
    </div>

    <div class="spacer"></div>
    <span class="caption" id="caption">Information Systems Research Venue Portal</span>
  </nav>
  <iframe id="confFrame" title="Information Systems Conferences"></iframe>
  <iframe id="jourFrame" title="Information Systems Journals"></iframe>
</section>

<script>
const conferenceHTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Information Systems Conferences</title>\n<style>\n  :root {\n    --bg: #0f1220;\n    --panel: #171b30;\n    --panel-2: #1e2340;\n    --border: #2b3157;\n    --text: #e7e9f5;\n    --muted: #9aa0c3;\n    --accent: #7c8cff;\n    --accent-2: #35d0ba;\n    --amber: #f6b93b;\n    --red: #ef6461;\n    --radius: 14px;\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n  }\n  * { box-sizing: border-box; }\n  body {\n    margin: 0;\n    background: radial-gradient(1200px 600px at 10% -10%, #232a52 0%, transparent 60%),\n                radial-gradient(1000px 500px at 110% 10%, #1a3a3a 0%, transparent 55%),\n                var(--bg);\n    color: var(--text);\n    min-height: 100vh;\n    padding-bottom: 60px;\n  }\n  header.hero {\n    padding: 40px 24px 28px;\n    text-align: center;\n    max-width: 1100px;\n    margin: 0 auto;\n  }\n  header.hero h1 {\n    font-size: 2.1rem;\n    margin: 0 0 6px;\n    background: linear-gradient(90deg, var(--accent), var(--accent-2));\n    -webkit-background-clip: text;\n    background-clip: text;\n    color: transparent;\n    font-weight: 800;\n    letter-spacing: -0.02em;\n  }\n  header.hero p.sub {\n    color: var(--muted);\n    margin: 4px 0;\n    font-size: 0.98rem;\n  }\n  .stat-row {\n    display: flex;\n    justify-content: center;\n    gap: 14px;\n    flex-wrap: wrap;\n    margin-top: 18px;\n  }\n  .stat {\n    background: var(--panel);\n    border: 1px solid var(--border);\n    border-radius: 12px;\n    padding: 10px 18px;\n    min-width: 110px;\n  }\n  .stat b { display:block; font-size: 1.4rem; color: var(--accent-2); }\n  .stat span { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }\n\n  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }\n\n  details.about {\n    background: var(--panel);\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    padding: 14px 18px;\n    margin: 18px 0;\n  }\n  details.about summary {\n    cursor: pointer;\n    font-weight: 600;\n    color: var(--accent);\n    outline: none;\n  }\n  details.about .about-body { margin-top: 12px; color: var(--muted); font-size: 0.92rem; line-height: 1.55; }\n  details.about .about-body p { margin: 0 0 10px; }\n  .legend-chips { display:flex; gap:10px; flex-wrap:wrap; margin-top: 10px; }\n  .legend-chip { border:1px solid var(--border); border-radius:8px; padding:4px 10px; font-size:0.8rem; }\n  .legend-chip b { color: var(--accent-2); }\n\n  .toolbar {\n    position: sticky;\n    top: 0;\n    z-index: 20;\n    background: rgba(15,18,32,0.92);\n    backdrop-filter: blur(8px);\n    padding: 14px 0;\n    border-bottom: 1px solid var(--border);\n  }\n  .toolbar-inner {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 10px;\n    align-items: center;\n  }\n  .search-box {\n    flex: 1 1 260px;\n    position: relative;\n  }\n  .search-box input {\n    width: 100%;\n    padding: 11px 14px 11px 38px;\n    border-radius: 10px;\n    border: 1px solid var(--border);\n    background: var(--panel-2);\n    color: var(--text);\n    font-size: 0.95rem;\n  }\n  .search-box input:focus { outline: 2px solid var(--accent); }\n  .search-box::before {\n    content: \"🔍\";\n    position: absolute;\n    left: 12px;\n    top: 50%;\n    transform: translateY(-50%);\n    opacity: 0.7;\n  }\n  select, .chip-toggle {\n    padding: 10px 12px;\n    border-radius: 10px;\n    border: 1px solid var(--border);\n    background: var(--panel-2);\n    color: var(--text);\n    font-size: 0.88rem;\n  }\n  .chip-toggle {\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    cursor: pointer;\n    user-select: none;\n  }\n  .chip-toggle input { accent-color: var(--accent); }\n  button#resetBtn {\n    padding: 10px 14px;\n    border-radius: 10px;\n    border: 1px solid var(--border);\n    background: transparent;\n    color: var(--muted);\n    cursor: pointer;\n  }\n  button#resetBtn:hover { color: var(--text); border-color: var(--accent); }\n\n  .result-meta {\n    color: var(--muted);\n    font-size: 0.85rem;\n    margin: 14px 2px 8px;\n    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;\n  }\n\n  .grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));\n    gap: 14px;\n    margin-top: 6px;\n  }\n  .card {\n    background: var(--panel);\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    padding: 16px 18px;\n    transition: transform .12s ease, border-color .12s ease;\n  }\n  .card:hover { border-color: var(--accent); transform: translateY(-2px); }\n  .card-top {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n    gap: 10px;\n  }\n  .card-title { font-size: 1.02rem; font-weight: 700; }\n  .card-title .num { color: var(--muted); font-weight: 500; margin-right: 4px; }\n  .card-name { color: var(--muted); font-size: 0.85rem; margin: 3px 0 10px; line-height: 1.35; }\n  .badge {\n    display: inline-block;\n    font-size: 0.72rem;\n    padding: 2px 9px;\n    border-radius: 999px;\n    font-weight: 700;\n    letter-spacing: .02em;\n    white-space: nowrap;\n  }\n  .badge.month { background: rgba(124,140,255,0.18); color: var(--accent); border: 1px solid rgba(124,140,255,0.35); }\n  .badge.code-2Y { background: rgba(53,208,186,0.18); color: var(--accent-2); border:1px solid rgba(53,208,186,.35);}\n  .badge.code-1Y { background: rgba(246,185,59,0.18); color: var(--amber); border:1px solid rgba(246,185,59,.35);}\n  .badge.code-V  { background: rgba(239,100,97,0.15); color: var(--red); border:1px solid rgba(239,100,97,.35);}\n  .badge.code-H  { background: rgba(154,160,195,0.15); color: var(--muted); border:1px solid var(--border);}\n  .badge.jufo { background: rgba(255,255,255,0.06); color: var(--muted); border:1px solid var(--border); }\n  .badge.jufo-level-3 { background: rgba(53,208,186,0.18); color: var(--accent-2); border:1px solid rgba(53,208,186,.35);}\n  .badge.jufo-level-2 { background: rgba(124,140,255,0.18); color: var(--accent); border:1px solid rgba(124,140,255,.35);}\n  .badge.jufo-level-1 { background: rgba(246,185,59,0.18); color: var(--amber); border:1px solid rgba(246,185,59,.35);}\n  .badge.jufo-level-0 { background: rgba(154,160,195,0.15); color: var(--muted); border:1px solid var(--border);}\n  .badge.core-A-star { background: rgba(53,208,186,0.18); color: var(--accent-2); border:1px solid rgba(53,208,186,.35);}\n  .badge.core-A { background: rgba(124,140,255,0.18); color: var(--accent); border:1px solid rgba(124,140,255,.35);}\n  .badge.core-B { background: rgba(246,185,59,0.18); color: var(--amber); border:1px solid rgba(246,185,59,.35);}\n  .badge.core-C { background: rgba(239,100,97,0.15); color: var(--red); border:1px solid rgba(239,100,97,.35);}\n  .card-month-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }\n  .card-evidence { font-size: 0.86rem; color: var(--text); line-height: 1.5; margin-bottom: 10px; }\n  .card-category { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }\n  .card-links { display:flex; gap:8px; flex-wrap:wrap; }\n  .card-links a {\n    color: var(--accent);\n    text-decoration: none;\n    font-size: 0.8rem;\n    border: 1px solid var(--border);\n    padding: 3px 9px;\n    border-radius: 7px;\n  }\n  .card-links a:hover { border-color: var(--accent); background: rgba(124,140,255,0.1); }\n\n  mark { background: rgba(246,185,59,0.45); color: inherit; border-radius: 3px; padding: 0 1px; }\n\n  .empty-state {\n    text-align: center;\n    padding: 60px 20px;\n    color: var(--muted);\n  }\n\n  footer {\n    text-align: center;\n    color: var(--muted);\n    font-size: 0.78rem;\n    margin-top: 40px;\n  }\n\n  @media (max-width: 640px) {\n    header.hero h1 { font-size: 1.5rem; }\n    .toolbar-inner { flex-direction: column; align-items: stretch; }\n  }\n</style>\n</head>\n<body>\n\n<header class=\"hero\">\n  <h1>Information Systems Conferences</h1>\n  <p class=\"sub\">144 conferences and related research venues &middot; typical submission months, edition evidence and JUFO cross-reference</p>\n  <p class=\"sub\">Research checked: 28 September 2026</p>\n  <div class=\"stat-row\">\n    <div class=\"stat\"><b id=\"statTotal\">144</b><span>Total venues</span></div>\n    <div class=\"stat\"><b id=\"statDated\">111</b><span>Dated evidence</span></div>\n    <div class=\"stat\"><b id=\"statJufo\">0</b><span>With JUFO ID</span></div>\n    <div class=\"stat\"><b id=\"statCore\">0</b><span>With CORE rank</span></div>\n    <div class=\"stat\"><b id=\"statEra\">0</b><span>With ERA rank</span></div>\n    <div class=\"stat\"><b id=\"statQualis\">0</b><span>With Qualis rank</span></div>\n    <div class=\"stat\"><b id=\"statShown\">144</b><span>Currently shown</span></div>\n  </div>\n</header>\n\n<div class=\"container\">\n\n  <details class=\"about\">\n    <summary>About this directory &amp; how to read the evidence codes</summary>\n    <div class=\"about-body\">\n      <p>A worldwide directory covering core Information Systems (IS), regional and national IS meetings, specialist conferences, AIS research workshops, information-systems engineering, and selected adjacent research communities.</p>\n      <p>The month column is a planning estimate &mdash; the recurring month where editions agree, or the observed window where they differ. It is not an arithmetic average. Dates refer to the initial full research-paper submission unless a row says otherwise. Always confirm the current call before submitting.</p>\n      <p><b>JUFO level</b> comes from Finland's official Publication Forum export (jufo-rest.csc.fi), shown only for the 40 venues with a JUFO ID (0&ndash;3, higher is more selective). < tes are listed.\"}, {\"code\": \"1Y\", \"meaning\": \"One edition only: a provisional planning month, not an established average.\"}, {\"code\": \"V\", \"meaning\": \"Variable timing, several rounds, or a material schedule change; no single average.\"}, {\"code\": \"H\", \"meaning\": \"Historical observation only; not a current submission forecast.\"}], \"categories\": [{\"num\": 1, \"name\": \"Core and national IS conferences\"}, {\"num\": 2, \"name\": \"Regional, educational and broad IS conferences\"}, {\"num\": 3, \"name\": \"Digital business, IS economics and analytics\"}, {\"num\": 4, \"name\": \"Design science, development and decision support\"}, {\"num\": 5, \"name\": \"AIS and specialist research workshops\"}, {\"num\": 6, \"name\": \"Information-systems engineering and enterprise modeling\"}, {\"num\": 7, \"name\": \"Digital government and crisis information systems\"}, {\"num\": 8, \"name\": \"Adjacent venues for relevant IS research\"}, {\"num\": 9, \"name\": \"Additional, historical and unconfirmed venues\"}], \"months\": [\"January\", \"February\", \"March\", \"April\", \"May\", \"June\", \"July\", \"August\", \"September\", \"October\", \"November\", \"December\", \"Not established / Other\"]}<\/script>\n<script>\nconst DATA = JSON.parse(document.getElementById('data').textContent);\nconst records = DATA.records;\n\nconst grid = document.getElementById('grid');\nconst searchInput = document.getElementById('searchInput');\nconst categoryFilter = document.getElementById('categoryFilter');\nconst monthFilter = document.getElementById('monthFilter');\nconst codeFilter = document.getElementById('codeFilter');\nconst jufoLevelFilter = document.getElementById('jufoLevelFilter');\nconst coreRankFilter = document.getElementById('coreRankFilter');\nconst eraRankFilter = document.getElementById('eraRankFilter');\nconst qualisRankFilter = document.getElementById('qualisRankFilter');\nconst jufoOnly = document.getElementById('jufoOnly');\nconst resetBtn = document.getElementById('resetBtn');\nconst resultCount = document.getElementById('resultCount');\nconst emptyState = document.getElementById('emptyState');\nconst statShown = document.getElementById('statShown');\nconst statJufo = document.getElementById('statJufo');\nconst statDated = document.getElementById('statDated');\n\nDATA.categories.forEach(c => {\n  const opt = document.createElement('option');\n  opt.value = c.num;\n  opt.textContent = c.num + '. ' + c.name;\n  categoryFilter.appendChild(opt);\n});\nDATA.months.forEach(m => {\n  const opt = document.createElement('option');\n  opt.value = m;\n  opt.textContent = m;\n  monthFilter.appendChild(opt);\n});\n\nconst legendChips = document.getElementById('legendChips');\nDATA.legend.forEach(l => {\n  const el = document.createElement('div');\n  el.className = 'legend-chip';\n  el.innerHTML = '<b>' + l.code + '</b> &mdash; ' + l.meaning;\n  legendChips.appendChild(el);\n});\n\nstatJufo.textContent = records.filter(r => r.jufoId).length;\nstatCore.textContent = records.filter(r => r.coreRank).length;\nstatEra.textContent = records.filter(r => r.eraRank).length;\nstatQualis.textContent = records.filter(r => r.qualisRank).length;\nstatDated.textContent = records.filter(r => r.evidenceCode === '2Y' || r.evidenceCode === '1Y' || r.evidenceCode === 'V').length;\n\nconst JUFO_LEVEL_LABEL = { '0': '0 - basic', '1': '1 - leading', '2': '2 - leading (higher)', '3': '3 - top' };\nArray.from(new Set(records.filter(r => r.jufoLevel !== '').map(r => r.jufoLevel))).sort().forEach(lv => {\n  const opt = document.createElement('option');\n  opt.value = lv;\n  opt.textContent = 'JUFO ' + (JUFO_LEVEL_LABEL[lv] || lv);\n  jufoLevelFilter.appendChild(opt);\n});\nconst CORE_ORDER = ['A*', 'A', 'B', 'C'];\nArray.from(new Set(records.filter(r => r.coreRank).map(r => r.coreRank)))\n  .sort((a, b) => CORE_ORDER.indexOf(a) - CORE_ORDER.indexOf(b))\n  .forEach(rk => {\n    const opt = document.createElement('option');\n    opt.value = rk;\n    opt.textContent = 'CORE ' + rk;\n    coreRankFilter.appendChild(opt);\n  });\nconst ERA_ORDER = ['A', 'B', 'C'];\nArray.from(new Set(records.filter(r => r.eraRank).map(r => r.eraRank)))\n  .sort((a, b) => ERA_ORDER.indexOf(a) - ERA_ORDER.indexOf(b))\n  .forEach(rk => {\n    const opt = document.createElement('option');\n    opt.value = rk;\n    opt.textContent = 'ERA ' + rk;\n    eraRankFilter.appendChild(opt);\n  });\nconst QUALIS_ORDER = ['A1', 'A2', 'B1', 'B2', 'B3', 'B4', 'B5', 'C'];\nArray.from(new Set(records.filter(r => r.qualisRank).map(r => r.qualisRank)))\n  .sort((a, b) => QUALIS_ORDER.indexOf(a) - QUALIS_ORDER.indexOf(b))\n  .forEach(rk => {\n    const opt = document.createElement('option');\n    opt.value = rk;\n    opt.textContent = 'Qualis ' + rk;\n    qualisRankFilter.appendChild(opt);\n  });\n\nfunction escapeHtml(s) {\n  return s.replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n}\n\nfunction highlight(text, q) {\n  if (!q) return escapeHtml(text);\n  const esc = escapeHtml(text);\n  try {\n    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + ')', 'ig');\n    return esc.replace(re, '<mark>$1</mark>');\n  } catch (e) { return esc; }\n}\n\nfunction render() {\n  const q = searchInput.value.trim().toLowerCase();\n  const cat = categoryFilter.value;\n  const month = monthFilter.value;\n  const code = codeFilter.value;\n  const jLevel = jufoLevelFilter.value;\n  const cRank = coreRankFilter.value;\n  const eRank = eraRankFilter.value;\n  const qRank = qualisRankFilter.value;\n  const jOnly = jufoOnly.checked;\n\n  const filtered = records.filter(r => {\n    if (cat && String(r.categoryNum) !== cat) return false;\n    if (month && r.monthBucket !== month) return false;\n    if (code && r.evidenceCode !== code) return false;\n    if (jLevel && r.jufoLevel !== jLevel) return false;\n    if (cRank && r.coreRank !== cRank) return false;\n    if (eRank && r.eraRank !== eRank) return false;\n    if (qRank && r.qualisRank !== qRank) return false;\n    if (jOnly && !r.jufoId) return false;\n    if (q) {\n      const hay = (r.acronym + ' ' + r.name + ' ' + r.month + ' ' + r.evidenceText + ' ' + r.category).toLowerCase();\n      if (!hay.includes(q)) return false;\n    }\n    return true;\n  });\n\n  grid.innerHTML = '';\n  if (filtered.length === 0) {\n    emptyState.style.display = 'block';\n  } else {\n    emptyState.style.display = 'none';\n    const frag = document.createDocumentFragment();\n    filtered.forEach(r => frag.appendChild(cardFor(r, q)));\n    grid.appendChild(frag);\n  }\n  resultCount.textContent = 'Showing ' + filtered.length + ' of ' + records.length + ' venues';\n  statShown.textContent = filtered.length;\n}\n\nfunction cardFor(r, q) {\n  const card = document.createElement('div');\n  card.className = 'card';\n  const codeClass = r.evidenceCode ? 'code-' + r.evidenceCode : '';\n  const coreClass = r.coreRank === 'A*' ? 'core-A-star' : 'core-' + r.coreRank;\n  const eraClass = 'core-' + r.eraRank;\n  const qualisClass = 'core-' + (r.qualisRank ? r.qualisRank.charAt(0) : '');\n  const links = r.links.map(l => '<a href=\"' + l.url + '\" target=\"_blank\" rel=\"noopener noreferrer\">' + escapeHtml(l.label) + '</a>').join('');\n  card.innerHTML = `\n    <div class=\"card-category\">${r.categoryNum}. ${escapeHtml(r.category)}</div>\n    <div class=\"card-top\">\n      <div class=\"card-title\"><span class=\"num\">#${r.num}</span>${highlight(r.acronym, q)}</div>\n      ${r.jufoId ? '<span class=\"badge jufo\">JUFO ' + r.jufoId + '</span>' : ''}\n    </div>\n    <div class=\"card-name\">${highlight(r.name, q)}</div>\n    <div class=\"card-month-row\">\n      <span class=\"badge month\">${highlight(r.month, q)}</span>\n      ${r.evidenceCode ? '<span class=\"badge ' + codeClass + '\">' + r.evidenceCode + '</span>' : ''}\n      ${r.jufoLevel !== '' ? '<span class=\"badge jufo-level-' + r.jufoLevel + '\" title=\"JUFO level\">JUFO lvl ' + r.jufoLevel + '</span>' : ''}\n      ${r.coreRank ? '<span class=\"badge ' + coreClass + '\" title=\"ICORE/CORE conference rank\">CORE ' + r.coreRank + '</span>' : ''}\n      ${r.eraRank ? '<span class=\"badge ' + eraClass + '\" title=\"ERA 2010 conference rank\">ERA ' + r.eraRank + '</span>' : ''}\n      ${r.qualisRank ? '<span class=\"badge ' + qualisClass + '\" title=\"Qualis 2012 conference rank\">Qualis ' + r.qualisRank + '</span>' : ''}\n    </div>\n    <div class=\"card-evidence\">${highlight(r.evidenceText, q)}</div>\n    <div class=\"card-links\">${links}</div>\n  `;\n  return card;\n}\n\n[searchInput, categoryFilter, monthFilter, codeFilter, jufoLevelFilter, coreRankFilter, eraRankFilter, qualisRankFilter, jufoOnly].forEach(el => {\n  el.addEventListener('input', render);\n  el.addEventListener('change', render);\n});\nresetBtn.addEventListener('click', () => {\n  searchInput.value = '';\n  categoryFilter.value = '';\n  monthFilter.value = '';\n  codeFilter.value = '';\n  jufoLevelFilter.value = '';\n  coreRankFilter.value = '';\n  eraRankFilter.value = '';\n  qualisRankFilter.value = '';\n  jufoOnly.checked = false;\n  render();\n});\n\nrender();\n<\/script>\n</body>\n</html>\n";
const journalHTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Information Systems Journals — JUFO 2026 Directory</title>\n<style>\n:root {\n  --bg: #f7f9f5;\n  --panel: #ffffff;\n  --panel-soft: #f2f7f3;\n  --ink: #24332f;\n  --muted: #6c7d77;\n  --line: #dfe9e3;\n  --accent: #4c7c6a;\n  --accent-2: #6d8fa3;\n  --accent-soft: #e8f2ed;\n  --gold-soft: #f5efdf;\n  --blue-soft: #eaf1f6;\n  --lav-soft: #f1edf7;\n  --shadow: 0 12px 32px rgba(52, 78, 67, 0.08);\n}\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n  background:\n    radial-gradient(circle at top right, rgba(191,217,205,.28), transparent 28rem),\n    linear-gradient(180deg, #fbfcf9 0%, var(--bg) 100%);\n  color: var(--ink);\n}\na { color: var(--accent); }\n.wrap { max-width: 1480px; margin: 0 auto; padding: 28px 24px 60px; }\n.hero {\n  background: linear-gradient(135deg, #eef6f1 0%, #f8faf7 62%, #edf4f7 100%);\n  border: 1px solid var(--line);\n  border-radius: 24px;\n  padding: 30px;\n  box-shadow: var(--shadow);\n  margin-bottom: 22px;\n}\n.eyebrow {\n  display: inline-flex; gap: 8px; align-items: center;\n  font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;\n  color: var(--accent); background: rgba(255,255,255,.72); border: 1px solid var(--line);\n  border-radius: 999px; padding: 7px 11px;\n}\nh1 { margin: 14px 0 8px; font-size: clamp(30px, 4vw, 48px); line-height: 1.08; letter-spacing: -.035em; }\n.subtitle { color: var(--muted); max-width: 980px; font-size: 16px; line-height: 1.65; margin: 0; }\n.stats {\n  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;\n  margin-top: 24px;\n}\n.stat {\n  background: rgba(255,255,255,.76); border: 1px solid var(--line);\n  border-radius: 16px; padding: 16px 18px;\n}\n.stat .n { font-size: 27px; font-weight: 800; letter-spacing: -.03em; }\n.stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }\n\n.controls {\n  position: sticky; top: 0; z-index: 20;\n  background: rgba(247,249,245,.91); backdrop-filter: blur(12px);\n  border: 1px solid var(--line); border-radius: 20px;\n  padding: 16px; box-shadow: 0 8px 24px rgba(51,74,64,.07);\n  margin: 0 0 18px;\n}\n.control-grid {\n  display: grid;\n  grid-template-columns: minmax(280px, 2fr) repeat(3, minmax(150px, 1fr)) auto;\n  gap: 10px;\n}\ninput, select, button {\n  width: 100%; min-height: 44px;\n  border: 1px solid #cfddd5; border-radius: 12px;\n  background: #fff; color: var(--ink); font: inherit;\n}\ninput, select { padding: 0 12px; }\ninput:focus, select:focus { outline: 3px solid rgba(76,124,106,.13); border-color: var(--accent); }\nbutton {\n  width: auto; padding: 0 15px; cursor: pointer; font-weight: 700;\n  background: var(--accent-soft); border-color: #cfe0d7;\n}\nbutton:hover { transform: translateY(-1px); }\n.control-foot {\n  display: flex; justify-content: space-between; align-items: center; gap: 16px;\n  color: var(--muted); font-size: 13px; padding-top: 10px;\n}\n.active-count strong { color: var(--ink); }\n.table-shell {\n  overflow: auto; border: 1px solid var(--line);\n  border-radius: 20px; background: var(--panel); box-shadow: var(--shadow);\n}\ntable { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1120px; }\nthead th {\n  position: sticky; top: 0; z-index: 5;\n  padding: 14px 14px; text-align: left; font-size: 12px;\n  text-transform: uppercase; letter-spacing: .06em; color: #52645e;\n  background: #eef4f0; border-bottom: 1px solid var(--line);\n  cursor: pointer; user-select: none;\n}\nthead th:first-child { padding-left: 18px; }\ntbody td {\n  padding: 15px 14px; vertical-align: top; border-bottom: 1px solid #edf2ee;\n  font-size: 14px; line-height: 1.45;\n}\ ctory</h2>\n      <p>\n        <strong>AIS Premier 11</strong> identifies the College of Senior Scholars’ premier IS journals.\n        <strong>FT50</strong> marks the Financial Times research-journal list overlap.\n        <strong>AIS SIG</strong> means the outlet is recommended by at least one AIS Special Interest Group;\n        it is not equivalent to Premier 11 status.\n      </p>\n      <p>\n        The source document notes that the JUFO portal still displays Levels 1–3 during 2026 and that the\n        Finnish Publication Forum is transitioning its classification structure. Use JUFO as publication-channel\n        information rather than as a stand-alone measure of an individual article or researcher.\n      </p>\n    </div>\n    <div class=\"info\">\n      <h2>Reference sources</h2>\n      <div class=\"links\">\n        <a href=\"https://jfp.csc.fi/jufoportal\" target=\"_blank\" rel=\"noopener\"><span>JUFO Portal</span><span>↗</span></a><a href=\"https://julkaisufoorumi.fi/en/publication-forum\" target=\"_blank\" rel=\"noopener\"><span>Publication Forum</span><span>↗</span></a><a href=\"https://julkaisufoorumi.fi/en/publication-forum/information-julkaisufoorumifi-site/jufo-portal-user-guide\" target=\"_blank\" rel=\"noopener\"><span>JUFO Portal user guide</span><span>↗</span></a><a href=\"https://aisnet.org/research/seniorscholarsbasket/\" target=\"_blank\" rel=\"noopener\"><span>AIS Senior Scholars’ Premier Journals</span><span>↗</span></a><a href=\"https://aisel.aisnet.org/journals/\" target=\"_blank\" rel=\"noopener\"><span>AIS Journals</span><span>↗</span></a><a href=\"https://www.ft.com/content/db863a0a-6524-45f9-bc52-fee997634bdc\" target=\"_blank\" rel=\"noopener\"><span>Financial Times research-journal list</span><span>↗</span></a>\n      </div>\n    </div>\n  </section>\n  <small class=\"footer\">Designed by G_Shankar Using AI assistance tool · &copy; G_Shankar </small>\n</div>\n\n<script>\nconst journals = [{\"journal\": \"Decision Support Systems \nconst searchEl = document.getElementById(\"search\");\nconst jufoEl = document.getElementById(\"jufo\");\nconst categoryEl = document.getElementById(\"category\");\nconst listEl = document.getElementById(\"list\");\nconst tbody = document.getElementById(\"tbody\");\nconst countEl = document.getElementById(\"count\");\nconst emptyEl = document.getElementById(\"empty\");\n\nfunction esc(s) {\n  return String(s ?? \"\").replace(/[&<>\"']/g, ch => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[ch]));\n}\nfunction statusBadges(j) {\n  const b = [];\n  if (j.premier) b.push('<span class=\"badge b-premier\">AIS Premier 11</span>');\n  if (j.ft50) b.push('<span class=\"badge b-ft\">FT50</span>');\n  if (j.ais_sig) b.push('<span class=\"badge b-sig\">AIS SIG</span>');\n  const residual = j.status\n    .replace(/AIS Premier 11;?\\s*/g, \"\")\n    .replace(/FT50;?\\s*/g, \"\")\n    .trim();\n  if (residual && !j.ais_sig) b.push('<span class=\"badge b-other\">' + esc(residual) + '</span>');\n  else if (residual && j.ais_sig) {\n    const cleaned = residual.replace(/^AIS SIG\\s*/i, \"\").trim();\n    if (cleaned) b.push('<span class=\"badge b-other\">' + esc(cleaned) + '</span>');\n  }\n  return b.join(\"\");\n}\nfunction matchesList(j, v) {\n  if (!v) return true;\n  if (v === \"premier\") return j.premier;\n  if (v === \"ft50\") return j.ft50;\n  if (v === \"sig\") return j.ais_sig;\n  if (v === \"adjacent\") return j.adjacent || /Adjacent/i.test(j.status);\n  return true;\n}\nfunction render() {\n  const q = searchEl.value.trim().toLowerCase();\n  const jufo = jufoEl.value;\n  const cat = categoryEl.value;\n  const list = listEl.value;\n\n  let rows = journals.filter(j => {\n    const haystack = [j.short, j.journal, j.scope, j.status, j.category].join(\" \").toLowerCase();\n    return (!q || haystack.includes(q))\n      && (!jufo || j.jufo === jufo)\n      && (!cat || j.category === cat)\n      && matchesList(j, list);\n  });\n\n  rows.sort const menuBtn = document.getElementById("menuBtn");
const navLinks = document.getElementById("navLinks");

function setMenu(open) {
  navLinks.classList.toggle("open", open);
  menuBtn.classList.toggle("open", open);
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
}

menuBtn.addEventListener("click", () => {
  setMenu(!navLinks.classList.contains("open"));
});

window.addEventListener("resize", () => {
  if (window.innerWidth > 900) setMenu(false);
});

function themedDoc(docString, theme) {
  if (theme !== "dark") return docString;
  return docString.replace("</head>", childThemeCSS(theme) + "</head>");
}

function refreshLoadedFrames(theme) {
  if (loadedConf) confFrame.srcdoc = themedDoc(conferenceHTML, theme);
  if (loadedJour) jourFrame.srcdoc = themedDoc(journalHTML, theme);
}

function applyTheme(theme, refreshFrames=true) {
  document.documentElement.setAttribute("data-theme", "dark");
  if (refreshFrames) refreshLoadedFrames("dark");
}
function toggleTheme() { applyTheme("dark"); }
let loadedConf = false;
let loadedJour = false;

function ensureLoaded(which) {
  if (which === "conferences" && !loadedConf) {
    confFrame.srcdoc = themedDoc(conferenceHTML, "dark");
    loadedConf = true;
  }
  if (which === "journals" && !loadedJour) {
    jourFrame.srcdoc = themedDoc(journalHTML, "dark");
    loadedJour = true;
  }
}

function openSection(which, updateHash=true) {
  ensureLoaded(which);
  chooser.style.display = "none";
  workspace.style.display = "block";

  const isConf = which === "conferences";
  confFrame.classList.toggle("active", isConf);
  jourFrame.classList.toggle("active", !isConf);
  confTab.classList.toggle("active", isConf);
  jourTab.classList.toggle("active", !isConf);
  caption.textContent = isConf ? "IS Conference Submission Calendar" : "IS Journal Directory";

  if (updateHash) history.replaceState(null, "", isConf ? "#conferences" : "#journals");
  window.scrollTo(0,0);
}

function goHome() {
  workspace.style.display = "none";
  chooser.style.display = "grid";
  confFrame.classList.remove("active");
  jourFrame.classList.remove("active");
  confTab.classList.remove("active");
  jourTab.classList.remove("active");
  history.replaceState(null, "", location.pathname + location.search);
  window.scrollTo(0,0);
}

document.querySelectorAll("[data-open]").forEach(btn => {
  btn.addEventListener("click", () => openSection(btn.dataset.open));
});
confTab.addEventListener("click", () => { openSection("conferences"); setMenu(false); });
jourTab.addEventListener("click", () => { openSection("journals"); setMenu(false); });
document.getElementById("homeBtn").addEventListener("click", () => { goHome(); setMenu(false); });


applyTheme("dark", false);

if (location.hash === "#conferences") openSection("conferences", false);
else if (location.hash === "#journals") openSection("journals", false);
